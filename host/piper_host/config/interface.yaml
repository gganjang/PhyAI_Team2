# 우리 토픽(왼쪽) ↔ 팀 README 로봇 인터페이스(오른쪽) 대응. README 가 바뀌면 이 파일만 고친다.
readme_bridge:
  ros__parameters:
    # 팔
    slave_state_topic: /slave/joint_states_single   # 슬레이브 드라이버 (joint1~6 rad, gripper = 전체 벌림 m)
    state_topic: /joint_states                      # README: joint1~8, joint7 = 폭/2, joint8 = -폭/2
    command_topic: /joint_ctrl_single               # README: joint1~6 rad, joint7 = 폭/2 (0~0.035 m)
    bridge_topic: /policy/joint_cmd                 # 안전 브리지(piper-follow) 입력. 슬레이브로 직접 보내지 않음
    # 카메라: README 이름 = 우리 카메라
    overhead_source: cam2                           # 천장 고정
    wrist_source: cam1                              # 슬레이브 손목
    # 좌표계
    world_frame: world                              # 테이블 원점: table_frame_file 이 있으면 그 점, 없으면 base_link 와 같은 위치
    table_frame_file: ~/piper_test/data/calib/table_frame.json   # ~/piper_test/tools/set_table_origin.py 로 고름 (캘리브레이션과 별개)
    base_frame: base_link                           # = 드라이버 end_pose 기준 (URDF FK 와 0.05 mm 이내)
    flange_frame: link6                             # URDF 손목 끝 링크
    # 펌웨어 end_pose 는 link6 기준 이 위치(m, 회전 없음)의 점이다. URDF 는 PIPER-L (launch/host.launch.py).
    # 2026-11-13 PIPER-L FK 로 재측정: 슬레이브 (0.84, -0.01, 5.70) mm, 방향 차 0.02° — 한 자세뿐이라 임시값.
    #   손목 카메라 캘리브레이션은 end_pose 기준이라 이만큼 옮겨 붙인다. 여러 자세로 다시 재기: ~/piper_test/tools/measure_end_pose_offset.py
    # (이전 값 (-17.66, 0.05, 15.16) mm 은 표준 PIPER URDF 로 잰 것 — 모델이 달라 생긴 차이였다)
    end_pose_in_flange: [0.00084, -0.00001, 0.00570]
    calibration_file: ~/piper_test/data/calib/calibration.json
